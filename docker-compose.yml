version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go API ───────────────────────────────────────────────────────────────────
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.docker
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data:
