version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       stockwise
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Go API ───────────────────────────────────────────────────────────────────
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:           postgres://postgres:password@postgres:5432/stockwise?sslmode=disable
      JWT_SECRET:             dev-secret-change-in-production-at-least-32-chars
      JWT_EXPIRATION_HOURS:   "24"
      PORT:                   "8080"
      ENV:                    development
      # Used by entrypoint.sh to probe readiness
      DB_HOST:                postgres
      DB_PORT:                "5432"
      DB_USER:                postgres
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  postgres_data:
